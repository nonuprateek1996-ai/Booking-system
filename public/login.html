<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest sign in — Staylist</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-portal="guest">
  <header class="site-header">
    <a class="brand" href="/">Staylist</a>
    <nav class="nav-actions" id="nav"></nav>
  </header>

  <main class="narrow">
    <p id="message" role="alert" hidden></p>

    <div class="card">
      <p class="portal-tag">Guest account</p>
      <h1 id="auth-title">Sign in to book</h1>

      <!-- Revealed by login.js only when Google sign-in is configured. -->
      <div id="google-row" hidden>
        <a class="google-btn" id="google-btn" href="/api/auth/google">
          <svg class="google-mark" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.95 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l2.99-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l2.99 2.33C4.66 5.16 6.65 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </a>
        <p class="divider"><span>or</span></p>
      </div>

      <form id="auth-form">
        <label id="name-row" hidden>Name<input type="text" id="name" maxlength="100" autocomplete="name"></label>
        <label>Email<input type="email" id="email" required maxlength="254" autocomplete="email"></label>
        <label id="phone-row" hidden>Phone (optional)
          <input type="tel" id="phone" maxlength="20" autocomplete="tel">
        </label>
        <label>Password<input type="password" id="password" required minlength="8" maxlength="72" autocomplete="current-password"></label>
        <button type="submit" id="submit">Sign in</button>
      </form>

      <p class="switch">
        <span id="toggle-text">New here?</span>
        <button type="button" id="toggle" class="link-btn">Create a guest account</button>
      </p>
      <p class="switch hint">Are you the owner? <a href="/owner-login.html">Owner sign in</a>.</p>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
