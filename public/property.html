<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property — Staylist</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Staylist</a>
    <nav id="nav"></nav>
  </header>

  <main class="detail">
    <p id="message" role="alert" hidden></p>
    <a class="back-link" href="/">← All properties</a>

    <h1 id="title"></h1>
    <p id="location" class="detail-location"></p>

    <div id="gallery" class="gallery"></div>

    <div class="detail-columns">
      <div>
        <section>
          <h2>About this place</h2>
          <p id="description" class="detail-description"></p>
        </section>

        <section id="rooms-section" hidden>
          <h2>Rooms</h2>
          <ul id="rooms" class="rooms"></ul>
        </section>

        <section id="booked-section" hidden>
          <h2>Already booked</h2>
          <ul id="booked" class="booked"></ul>
        </section>
      </div>

      <aside>
        <div class="card booking-card">
          <p id="price" class="detail-price"></p>
          <form id="booking-form">
            <label>Check-in<input type="date" id="checkIn" required></label>
            <label>Check-out<input type="date" id="checkOut" required></label>
            <label>Guests<input type="number" id="guests" value="1" min="1" required></label>
            <p id="total" class="total"></p>
            <button type="submit" id="book-btn">Book</button>
          </form>
          <p id="book-hint" class="hint"></p>
        </div>

        <div class="card contact-card">
          <h2>Contact the owner</h2>
          <p id="contact-name"></p>
          <p id="contact-email"></p>
          <p id="contact-phone"></p>
          <p id="contact-none" class="hint" hidden>The owner has not published contact details.</p>
        </div>
      </aside>
    </div>
  </main>

  <script type="module" src="/js/property.js"></script>
</body>
</html>
