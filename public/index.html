<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staylist — find a place to stay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Staylist</a>
    <nav id="nav"></nav>
  </header>

  <section class="hero">
    <h1>Find a place to stay</h1>
    <p>Browse homes, cottages and villas. No account needed to look around.</p>
    <form id="search-form" class="search">
      <label class="search-field">
        <span>Where</span>
        <input type="search" id="q" placeholder="Anywhere" maxlength="100">
      </label>
      <label class="search-field">
        <span>Check in</span>
        <input type="date" id="checkIn">
      </label>
      <label class="search-field">
        <span>Check out</span>
        <input type="date" id="checkOut">
      </label>
      <label class="search-field narrow">
        <span>Guests</span>
        <input type="number" id="guests" placeholder="Any" min="1" max="50">
      </label>
      <label class="search-field narrow">
        <span>Max ₹/night</span>
        <input type="number" id="maxPrice" placeholder="Any" min="1" step="500">
      </label>
      <button type="submit">Search</button>
    </form>
  </section>

  <main>
    <p id="message" role="alert" hidden></p>
    <div id="results-count" class="results-count"></div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>No properties match your search yet.</p>
  </main>

  <footer class="site-footer">
    <p>Own a place? <a href="/owner-login.html">List it on Staylist</a>.</p>
  </footer>

  <script type="module" src="/js/home.js"></script>
</body>
</html>
