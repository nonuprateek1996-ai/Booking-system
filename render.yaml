services:
  - type: web
    name: booking-system
    runtime: node
    # Starter rather than free for one reason: only paid instances may attach a
    # disk, and without a disk every restart takes the database with it.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    # The database and every uploaded photo live here. A disk survives deploys,
    # restarts and instance replacement — unlike the container filesystem, which
    # is rebuilt from the image each time and keeps nothing written at runtime.
    #
    # A disk attaches to exactly one instance, so deploys briefly stop the old
    # instance before starting the new one instead of overlapping them. For a
    # single-owner guesthouse site that is a few seconds, and the alternative is
    # losing the data.
    disk:
      name: booking-data
      mountPath: /data
      sizeGB: 1
    # A dedicated endpoint, so renaming a product route can never break the
    # deploy gate. If this service was created with an older blueprint, update
    # Settings -> Health Check Path by hand: Render does not always re-sync it.
    healthCheckPath: /healthz
    # Custom domain. Render provisions and renews the TLS certificate for both
    # names once the DNS records in docs/custom-domain.md resolve. The
    # onrender.com hostname keeps working alongside them.
    domains:
      - colonelsparadisebir.com
      - www.colonelsparadisebir.com
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      # The one hostname the site answers on. Every other name Render routes
      # here (the apex, the onrender.com URL) is redirected to it, so links,
      # bookmarks and search results all settle on a single address.
      #
      # This MUST match the direction of Render's own apex/www redirect, shown
      # as a "redirects to ..." badge on Settings -> Custom Domains. Render is
      # currently set to send the apex to www, so www is canonical here. Point
      # the two at each other and requests bounce between Render's edge and
      # this app until the browser gives up with ERR_TOO_MANY_REDIRECTS.
      - key: CANONICAL_HOST
        value: www.colonelsparadisebir.com
      # The owner account is provisioned from these at startup (no shell
      # needed). sync: false makes Render prompt for the values securely at
      # deploy time instead of storing them in the repository.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Points the database at the disk above. Without this the app falls back
      # to <repo>/data (src/db.js), which is on the container filesystem and is
      # thrown away on every deploy and restart — the disk would be mounted and
      # sit there empty. Paying for a disk and leaving this unset loses data
      # exactly as if there were no disk at all.
      - key: DATA_DIR
        value: /data
